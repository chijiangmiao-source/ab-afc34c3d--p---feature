services:
  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
    image: km-coverability-web:latest
    # 宿主机端口可配置：WEB_PORT 环境变量 / .env 文件，默认 8080
    ports:
      - "${WEB_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 3s
    restart: unless-stopped

  verify:
    build:
      context: .
      dockerfile: deploy/Dockerfile.verify
    image: km-coverability-verify:latest
    depends_on:
      web:
        condition: service_healthy
    environment:
      # verify 内访问容器网络中的 web 服务
      WEB_URL: http://web:8080
    restart: "no"
