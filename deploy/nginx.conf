server {
    listen       8080;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # 纯静态站点：无外部依赖，可完全离线
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /health.html {
        default_type text/html;
        add_header Cache-Control "no-store";
    }

    location = /healthz {
        default_type text/plain;
        return 200 "OK\n";
    }
}
